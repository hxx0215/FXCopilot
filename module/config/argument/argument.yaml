DungeonSetting:
  BattleField:
    type: select
    value: nv1
    option: [nv1,sv1,ma1,ns1,nv2,sv2,ma2,ns2]
  ArmTransport:
    type: select
    value: a-ng1
    option: [a-ng1,a-tp1,a-ac1,a-aa1,a-eq1,a-ng2,a-tp2,a-ac2,a-aa2,a-eq2]
TimeOdysseySetting:
  HostingMode:
    type: select
    value: foreground
    option: [foreground, background, manual]
  Mode:
    type: select
    value: default
    option: [default,normal, hard, hell, hell_ex]
  Times:
    type: select
    value: default
    option: [default,1,2,3,max]
  AutoDecommissioning:
    type: checkbox
    value: false
    option: [true, false]
  EnableContinuous:
    type: checkbox
    value: false
    option: [true, false]
  MinimalFuel:
    type: input
    value: 1000
    valuetype: 'int'
  ReturnPoint:
    type: input
    value: A
  ManualOrder:
    type: input
    value: 1
  ManualResult:
    type: select
    value: 'S'
    option: ['S', 'A']
  DelegateTimes:
    type: input
    value: 0
    valuetype: 'int'
  BattleCount:
    stored: StoredInt
